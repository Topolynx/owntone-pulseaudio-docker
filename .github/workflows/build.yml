name: Build and Push Native PipeWire Production Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            luciobt/owntone-pulseaudio:latest
            luciobt/owntone-pulseaudio:pipewire-native-307c8db6
          build-args: |
            REPOSITORY_URL=https://github.com/Topolynx/owntone-server.git
            REPOSITORY_BRANCH=pipewire-native
            REPOSITORY_COMMIT=307c8db642744f3dc96ee764d3468deb7674ceb7
          cache-from: type=gha,scope=pipewire-prod
          cache-to: type=gha,mode=max,scope=pipewire-prod
